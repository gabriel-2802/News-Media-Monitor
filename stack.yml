version: "3.8"

services:

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: news_monitor_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    deploy:
      restart_policy:
        condition: on-failure

  ai_service: 
    image: ai_service:latest           # <-- IMPORTANT
    ports:
      - "8002:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_NAME: news_monitor_db
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  rss_worker:
    image: rss_worker:latest           # <-- IMPORTANT
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/news_monitor_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      WORKER_INDEX: "{{.Task.Slot}}"
      WORKER_COUNT: 3
      CLASSIFICATION_API_URL: http://ai_service:8000/classify
    networks:
      - internal
    deploy:
      replicas: 3
      restart_policy:
        condition: on-failure

  spring_app:
    image: spring_app:latest           # <-- IMPORTANT
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/news_monitor_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin
      AI_SERVICE_URL: http://ai_service:8000
      CLUSTERING_API_URL: http://ai_service:8000/cluster
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

volumes:
  postgres-data:

networks:
  internal:
    driver: overlay
