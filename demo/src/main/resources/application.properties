spring.application.name=NewsMediaMonitor

# `async` for multithreading or `single-threaded` for single-threaded processing
monitoring.strategy=async

# `custom` for custom classification engine or `hf` for Hugging Face classification engine
monitoring.classification-engine=custom

scheduling.monitor-cluster=21600000

# configuration for the ThreadPoolExecutor used for async processing
monitoring.async.core-pool-size=6
monitoring.async.max-pool-size=10
monitoring.async.queue-capacity=100

spring.datasource.url=jdbc:postgresql://localhost:5432/news_monitor_db
spring.datasource.username=admin
spring.datasource.password=admin

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/migration/data.sql