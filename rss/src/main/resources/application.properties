spring.application.name=RssFetcher

spring.datasource.url=jdbc:postgresql://db:5432/news_monitor_db
spring.datasource.username=admin
spring.datasource.password=admin

monitoring.classification-engine=custom
classification.api.url=${CLASSIFICATION_API_URL:http://localhost:8000/classify}
clustering.api.url=${CLUSTERING_API_URL:http://localhost:8000/cluster}

server.port=-1

management.server.port=8081
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=rss_worker
management.server.address=0.0.0.0


