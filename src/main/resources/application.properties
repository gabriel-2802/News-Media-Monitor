spring.application.name=NewsMediaMonitor

monitoring.strategy=async

monitoring.async.core-pool-size=5
monitoring.async.max-pool-size=10
monitoring.async.queue-capacity=100

spring.datasource.url=jdbc:postgresql://localhost:5432/news_monitor_db
spring.datasource.username=admin
spring.datasource.password=admin

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
