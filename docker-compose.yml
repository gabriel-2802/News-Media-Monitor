services:

  # ── Neo4j ──────────────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.26
    container_name: news_monitor_neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-secret}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      # cypher-shell is always present; extract password from NEO4J_AUTH (format: neo4j/<pass>)
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s

  neo4j-migrations:
    image: neo4j:5.26
    container_name: news_monitor_neo4j_migrations
    restart: on-failure
    depends_on:
      neo4j:
        condition: service_healthy
    volumes:
      - ./neo4j/migrations:/migrations:ro
      - ./neo4j/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "/migrate.sh"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-secret}

  # ── RabbitMQ ───────────────────────────────────────────────────────────────

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: news_monitor_rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-secret}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  rabbitmq-setup:
    image: curlimages/curl:latest
    container_name: news_monitor_rabbitmq_setup
    restart: on-failure
    depends_on:
      rabbitmq:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/setup.sh"]
    environment:
      RABBITMQ_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_PASSWORD: "${RABBITMQ_PASSWORD:-secret}"
    volumes:
      - ./rabbitmq/setup.sh:/setup.sh:ro

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  rabbitmq_data:
