# docker-compose.yml
version: "3.8"

services:
  db:
    image: postgres:16
    container_name: news_monitor_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: news_monitor_db
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
