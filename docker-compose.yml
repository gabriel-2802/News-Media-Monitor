name: news-mm

services:
  # ── Infrastructure (always started by `docker compose up` / `make up`) ──
  # No `profiles:` on these — they must keep starting by default so the
  # existing "run manager/provider/workers manually against Dockerized
  # infra" workflow keeps working unchanged.

  neo4j:
    build:
      context: ./neo4j
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      # The official image treats every NEO4J_* env var as a neo4j.conf
      # setting override (that's how NEO4J_AUTH itself works) — do NOT add
      # another NEO4J_* var here (e.g. NEO4J_PASSWORD) to hand the password
      # to migrate.sh, it'll be misread as an invalid config key and the
      # server will refuse to start under strict validation. The password
      # is derived from NEO4J_AUTH inside entrypoint-wrapper.sh instead.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-secret}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
      - ./neo4j/migrations:/migrations:ro
      - ./neo4j/migrate.sh:/migrate.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' 2>/dev/null || exit 1"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 60s

  rabbitmq:
    build:
      context: ./rabbitmq
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-admin}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-secret}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/setup.sh:/setup.sh:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      POSTGRES_DB: "${POSTGRES_DB:-news_monitor}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-news_monitor}"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secret}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-secret}\" ping 2>/dev/null | grep -q PONG"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ── Apps (only started with `--profile apps`, e.g. `make up-full`) ──
  # Kept out of the default `up` so the old manual-deploy workflow (run
  # these yourself, against the infra above) is unaffected.

  manager:
    build:
      context: ./manager
      dockerfile: Dockerfile
    profiles: ["apps"]
    restart: unless-stopped
    ports:
      - "9000:9000"
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: "${POSTGRES_DB:-news_monitor}"
      DB_USERNAME: "${POSTGRES_USER:-postgres}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:-secret}"
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/news_monitor"
      APP_NEWS_PROVIDER_BASE_URL: http://provider:8080/news-provider
      JWT_PRIVATE_KEY_PATH: /keys/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys:/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/manager/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  provider:
    build:
      context: ./provider
      dockerfile: Dockerfile
    profiles: ["apps"]
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-secret}"
      NEO4J_DATABASE: neo4j
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/news_monitor"
      JWT_PUBLIC_KEY_PATH: /keys/jwt-public.pem
    volumes:
      - ./keys:/keys:ro
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/news-provider/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s

  scraper-worker:
    build:
      context: ./workers
      dockerfile: scraper/Dockerfile
    profiles: ["apps"]
    restart: unless-stopped
    deploy:
      replicas: 3
    env_file: .env
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/news_monitor"
      PROVIDER_URL: http://provider:8080/news-provider
      MANAGER_URL: http://manager:9000/manager
    depends_on:
      rabbitmq:
        condition: service_healthy
      manager:
        condition: service_healthy
      provider:
        condition: service_healthy

  classifier-worker:
    build:
      context: ./workers
      dockerfile: classifier/Dockerfile
    profiles: ["apps"]
    restart: unless-stopped
    deploy:
      replicas: 3
    env_file: .env
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/news_monitor"
      PROVIDER_URL: http://provider:8080/news-provider
      MANAGER_URL: http://manager:9000/manager
    depends_on:
      rabbitmq:
        condition: service_healthy
      manager:
        condition: service_healthy
      provider:
        condition: service_healthy

  cluster-worker:
    build:
      context: ./workers
      dockerfile: clusterer/Dockerfile
      args:
        EMBEDDING_MODEL_NAME: "${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}"
    profiles: ["apps"]
    restart: unless-stopped
    deploy:
      replicas: 3
    env_file: .env
    environment:
      RABBITMQ_URL: "amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-secret}@rabbitmq:5672/news_monitor"
      PROVIDER_URL: http://provider:8080/news-provider
      MANAGER_URL: http://manager:9000/manager
      REDIS_URL: "redis://:${REDIS_PASSWORD:-secret}@redis:6379/0"
    depends_on:
      rabbitmq:
        condition: service_healthy
      manager:
        condition: service_healthy
      provider:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  rabbitmq_data:
  postgres_data:
  redis_data:
