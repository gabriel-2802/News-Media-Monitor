server:
  port: ${SERVER_PORT:9000}
  servlet:
    context-path: /manager

spring:
  application:
    name: manager

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:news_monitor}
    username: ${DB_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: users

jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH:../keys/jwt-private.pem}
  public-key-path: ${JWT_PUBLIC_KEY_PATH:../keys/jwt-public.pem}
  expiration: ${JWT_EXPIRATION:86400000}

rabbitmq:
  url: ${RABBITMQ_URL:amqp://admin:secret@localhost:5672/news_monitor}
  scrape-jobs-queue: ${SCRAPE_JOBS_QUEUE:scrape.jobs}
  article-notifications-queue: ${ARTICLE_NOTIFICATIONS_QUEUE:article.notifications}

app:
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:Admin123!}
    name: ${APP_ADMIN_NAME:Admin}
    register-code: ${APP_ADMIN_REGISTER_CODE:devcode123}
  system:
    code: ${APP_SYSTEM_CODE:devsystemcode123}
  news-provider:
    base-url: ${APP_NEWS_PROVIDER_BASE_URL:http://localhost:8080/news-provider}
